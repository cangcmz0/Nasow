# Sky Survival: Turkce meslek dosyasi. Jobs Reborn varsayilanindan uyarlandi;
# oyuncu oldurme odulu ve yap-boz para donguleri (slime blogu) kaldirildi.
Explorer:
  fullname: Kasif
  displayName: '&3Kaşif'
  shortname: Ex
  FullDescription:
  - "&7Dünyayı keşfederek para kazanır."
  ChatColour: AQUA
  chat-display: full
  max-level: 200
  leveling-progression-equation: 10*(joblevel)+(joblevel*joblevel*4)
  income-progression-equation: baseincome+(baseincome*(joblevel-1)*0.01)-((baseincome+(baseincome*(joblevel-1)*0.01))
    * ((numjobs-1)*0.05))
  points-progression-equation: basepoints+(basepoints*(joblevel-1)*0.01)-((basepoints+(basepoints*(joblevel-1)*0.01))
    * ((numjobs-1)*0.05))
  experience-progression-equation: baseexperience-(baseexperience*((numjobs-1) *0.01))
  rejoinCooldown: 10
  maxDailyQuests: 1
  Quests:
    '1':
      Name: Galileo
      Objectives:
      - Explore;1;30
      RewardCommands:
      - eco give [playerName] 100
      - "msg [playerName] &aMeslek görevi tamamlandı! &e+100 para"
      RewardDesc:
      - "Yolculuğa çık ve para kazan"
      - "Ödül: 100 para"
  Gui:
    ItemStack: leather_boots
  Explore:
    '1':
      income: 5.0
      points: 5
      experience: 5.0
    '2':
      income: 2.5
      points: 2.5
      experience: 2.5
    '3':
      income: 1.0
      points: 1.0
      experience: 1.0
    '4':
      income: 0.5
      points: 0.5
      experience: 0.5
    '5':
      income: 0.1
      points: 0.1
      experience: 0.1  
  Brush:
    'suspicious_sand':
      income: 5
      points: 5
      experience: 5
    'suspicious_gravel':
      income: 6
      points: 6
      experience: 6
    coal:
      income: 10
      points: 10
      experience: 10   