# ============================================================================
#  Sky Survival - Sunucu Marketi (/market) fiyat listesi
# ============================================================================
#  Her satir:  "esya  alis-fiyati  satis-fiyati"
#    - alis 0 ise oyuncular bu esyayi marketten ALAMAZ
#    - satis 0 ise oyuncular bu esyayi markete SATAMAZ
#  Esya adlari Minecraft'in Ingilizce adlaridir (F3+H ile esya uzerinde gorunur),
#  ornegin oak_log, iron_ingot. Oyunda esya adlari oyuncunun dilinde (Turkce) gorunur.
#
#  Satis fiyati alistan dusuk olmali (yoksa al-sat yapip bedava para basilir);
#  eklenti bunu kontrol eder, hataliysa satis fiyatini alisin yarisina indirir.
#  Zumrut bilerek satilamaz: koyluler 32 cubuga 1 zumrut verir (indirimle 1 cubuga);
#  satilabilseydi "odun al -> cubuk -> zumrut -> sat" ile bedava para basilirdi.
#  Ciftlikle kolayca uretilen esyalarin (shulker kabugu, demir, altin...) satisini
#  yuksek tutmayin; bir ciftlik saatte binlerce tane uretebilir.
#  slot: ana menudeki yeri (0-26). simge: ana menude gorunen esya.
#  Degisiklikten sonra: /skycore reload
# ============================================================================
