name: SkyCore
version: '${version}'
main: net.skysurvival.skycore.SkyCore
api-version: '1.21'
description: Sky Survival'a ozel ozellikler (spawn adasi, market, klan, kasa, KOTH, mezar, gorevler, takas, agac kesme, savas modu...)
authors: [Sky Survival]
depend: [Vault]
softdepend: [Essentials, EssentialsSpawn, AuthMe, PlaceholderAPI, DecentHolograms]

commands:
  skycore:
    description: SkyCore yonetim komutlari
    aliases: [sc]
    permission: skycore.admin
  banknot:
    description: Parayi banknota cevirir
    usage: /banknot <miktar>
    aliases: [cek]
    permission: skycore.banknot
  kelle:
    description: Kelle avi (oduller)
    usage: /kelle [koy <oyuncu> <miktar> | liste | <oyuncu>]
    aliases: [bounty]
    permission: skycore.kelle
  odul:
    description: Gunluk odul
    aliases: [gunlukodul, daily]
    permission: skycore.odul
  discord:
    description: Discord adresimiz
  site:
    description: Web sitemiz
    aliases: [web]
  vahsi:
    description: Dunyada rastgele guvenli bir yere isinlanma
    aliases: [wild]
    permission: skycore.vahsi
  market:
    description: Sunucu marketi
    usage: /market [kategori]
    aliases: [magaza]
    permission: skycore.market
  sat:
    description: Elindekini ya da satilabilen her seyi markete sat
    usage: /sat [hepsi]
    permission: skycore.market
  klan:
    description: Klan komutlari
    usage: /klan [kur|davet|kabul|ayril|bilgi|liste|ev|banka|...]
    aliases: [clan]
    permission: skycore.klan
  klansohbet:
    description: Klan sohbeti
    usage: /ks <mesaj>
    aliases: [ks, kc]
    permission: skycore.klan
  koth:
    description: Tepenin Krali etkinligi bilgisi
    usage: /koth [katil]
    permission: skycore.koth
  mezar:
    description: Acilmamis mezarlarin
    aliases: [mezarlar, grave]
    permission: skycore.mezar
  gorev:
    description: Gunluk gorevler
    aliases: [gorevler, gorevim, quest]
    permission: skycore.gorev
  koruma:
    description: Yeni oyuncu korumasi
    usage: /koruma [kapat]
    permission: skycore.koruma
  takas:
    description: Guvenli takas
    usage: /takas <oyuncu> | kabul | reddet
    aliases: [trade]
    permission: skycore.takas

permissions:
  skycore.admin:
    description: SkyCore yonetim komutlari
    default: op
  skycore.banknot:
    default: true
  skycore.kelle:
    default: true
  skycore.odul:
    default: true
  skycore.vahsi:
    default: true
  skycore.vahsi.bekleme-yok:
    description: /vahsi beklemesi olmadan kullanir
    default: op
  skycore.market:
    default: true
  skycore.klan:
    default: true
  skycore.koth:
    default: true
  skycore.mezar:
    default: true
  skycore.mezar.admin:
    description: Kilitli mezarlari da acabilir
    default: op
  skycore.gorev:
    default: true
  skycore.koruma:
    default: true
  skycore.takas:
    default: true
  skycore.spawn.duzenle:
    description: Korumali spawn adasinda blok kirip koyabilir
    default: op
  skycore.savas.bypass:
    description: Savas moduna girmez (yetkililer icin)
    default: false
