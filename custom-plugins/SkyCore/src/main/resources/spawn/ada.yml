# Sky Survival spawn adasi noktalari (tools/spawn_island.py uretti).
# Koordinatlar adanin merkezine (meydanin zemini) gore. /skycore kurulum adayi config.yml'deki
# spawn-adasi.konum noktasina kurar ve bu noktalari oraya gore hesaplar.
boyut: {min: [-45, -45, -49], max: [51, 10, 46]}

# Yeni oyuncular ve /spawn buraya gelir (fiskiyeye bakar)
spawn: {x: 0.5, y: 1, z: 7.5, yaw: 180}

# Essentials warplari (/warp <isim>)
warplar:
  market: {x: 19.5, y: 1, z: 0.5, yaw: -90}
  arena: {x: 0.5, y: -3, z: 26.5, yaw: 0}
  kasalar: {x: -20.5, y: 1, z: 0.5, yaw: 90}
  portal: {x: 0.5, y: 1, z: -19.5, yaw: 180}
  atla: {x: 24.5, y: 1, z: -23.5, yaw: -135}

# Icine girilince komut calisan alanlar
portallar:
  vahsi-doga: {alan: {min: [-2, 1, -25], max: [2, 7, -23]}, komut: "vahsi"}
  market: {alan: {min: [26, 1, -1], max: [28, 3, 1]}, komut: "market"}

# PvP serbest alan (adanin geri kalaninda PvP kapali)
arena: {min: [-11, -3, 22], max: [11, 8, 44]}

# Tepenin Krali (KOTH) bolgesi: arenanin ortasindaki altin platform
koth: {min: [-1, -3, 32], max: [1, 0, 34]}

# Kasalar (sag tik + anahtar)
kasalar:
  gunluk: {x: -28, y: 2, z: -3}
  nadir: {x: -28, y: 2, z: 0}
  efsane: {x: -28, y: 2, z: 3}

# Hologramlar (DecentHolograms)
hologramlar:
  sky_hosgeldin:
    konum: {x: 0.5, y: 9.2, z: 0.5}
    satirlar:
      - "&b&lSKY SURVIVAL"
      - "&fGökyüzüne hoş geldin, &e%player_name%&f!"
      - "&7Dünyaya inmek için portala gir ya da adadan atla"
  sky_portal:
    konum: {x: 0.5, y: 11.5, z: -23.5}
    satirlar:
      - "&a&lVAHŞİ DOĞA"
      - "&7Rastgele bir yere ışınlanmak için içinden geç"
  sky_market:
    konum: {x: 20.5, y: 5.5, z: 0.5}
    satirlar:
      - "&e&lSUNUCU MARKETİ"
      - "&7Al-sat için içerideki zümrüt zemine bas"
      - "&7ya da her yerden &e/market"
  sky_arena:
    konum: {x: 0.5, y: 4.5, z: 19.5}
    satirlar:
      - "&c&lPVP ARENASI"
      - "&7Burada PvP serbest!"
      - "&6♛ KOTH etkinliği: &e/koth katil"
  sky_kasalar:
    konum: {x: -26.5, y: 10.5, z: 0.5}
    satirlar:
      - "&d&lKASALAR"
      - "&7Anahtarla sağ tıkla, ödülünü kazan"
      - "&7Anahtarlar: günlük ödül, aktiflik, KOTH"
  sky_kasa_gunluk:
    konum: {x: -27.5, y: 3.9, z: -2.5}
    satirlar:
      - "&a&lGÜNLÜK KASA"
      - "&7Anahtar: &f/odul"
  sky_kasa_nadir:
    konum: {x: -27.5, y: 3.9, z: 0.5}
    satirlar:
      - "&b&lNADİR KASA"
      - "&7Anahtar: &faktiflik ödülü"
  sky_kasa_efsane:
    konum: {x: -27.5, y: 3.9, z: 3.5}
    satirlar:
      - "&6&lEFSANE KASA"
      - "&7Anahtar: &fKOTH, 7 günlük seri"
  sky_atla:
    konum: {x: 32.5, y: 3.5, z: -31.5}
    satirlar:
      - "&b&lATLAMA NOKTASI"
      - "&7Buradan atla, süzülerek dünyaya in!"
  sky_rehber:
    konum: {x: -6.5, y: 3.5, z: -6.5}
    satirlar:
      - "&6&lREHBER"
      - "&e/jobs &7meslek • &e/skills &7yetenek"
      - "&e/klan &7klan • &e/market &7market"
      - "&e/odul &7günlük ödül • &e/kelle &7kelle avı"
      - "&e/gorev &7günlük görev • &e/takas &7güvenli takas"
      - "&7Arazi koruma: &6altın kürek"
