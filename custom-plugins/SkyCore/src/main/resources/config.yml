# ============================================================================
#  SkyCore - Sky Survival'a ozel eklenti
# ============================================================================
#  Her ozellik "aktif: true/false" ile acilip kapatilabilir.
#  Renk kodlari: &a yesil  &c kirmizi  &e sari  &b acik mavi  &6 altin
#                &7 gri  &f beyaz  &8 koyu gri  &l kalin
#  {oyuncu} gibi suslu parantezli yazilar otomatik doldurulur, silme.
#  Degisiklikten sonra oyunda/konsolda: /skycore reload
# ============================================================================

onek: "&8[&b&lSKY&8] &r"

# ---------------------------------------------------------------------------
# Savas modu: PvP'ye giren oyuncu belirli sure oyundan cikamaz ve
# isinlanma komutlarini kullanamaz. Savastayken cikan oyuncu olur.
# ---------------------------------------------------------------------------
savas:
  aktif: true
  sure-saniye: 15
  # Savastayken oyundan cikan oyuncu olur ve esyalari yere duser.
  kacana-ceza: true
  yasakli-komutlar: [spawn, home, homes, tpa, tpahere, tpaccept, tpyes, warp, warps, tpr, rtp, vahsi, wild, back, ec, enderchest, echest, sethome, afk, fly, tptoggle, kit]
  mesajlar:
    basladi: "&c⚔ Savaşa girdin! &7{sure} saniye boyunca oyundan çıkma."
    actionbar: "&c⚔ Savaştasın: &f{kalan} sn"
    bitti: "&a✔ Artık savaşta değilsin."
    komut-yasak: "&cSavaştayken bu komutu kullanamazsın! &7({kalan} sn)"
    kacti: "&c{oyuncu} &7savaştan kaçmaya çalıştı ve öldü!"

# ---------------------------------------------------------------------------
# Sohbet oyunlari: belirli araliklarla sohbete soru gelir, ilk bilen kazanir.
# turler: yaz (kelimeyi ilk yazan), matematik (islem), karisik (harfleri coz)
# ---------------------------------------------------------------------------
sohbet-oyunlari:
  aktif: true
  aralik-dakika: 10
  min-oyuncu: 2
  sure-saniye: 60
  odul: 250
  turler: [yaz, matematik, karisik]
  kelimeler: [elmas, zumrut, netherit, obsidyen, creeper, enderman, kilic, kalkan, sandik, firin,
    ejderha, iksir, buyu, madenci, ciftci, oduncu, balikci, kale, koy, kopek, kedi, inek, koyun,
    tavuk, zombi, iskelet, orumcek, slime, blaze, ghast, wither, portal, elytra, trident, yay,
    ok, mesale, kazma, kurek, balta, capa, demir, altin, komur, kirmizitas, lapis, kuvars, bal,
    karpuz, balkabagi, havuc, patates, ekmek, kurabiye, pasta, harita, pusula, saat, kitap]
  mesajlar:
    yaz: "&e&lSOHBET OYUNU &8» &fİlk yazan kazanır: &b{soru}"
    matematik: "&e&lSOHBET OYUNU &8» &fSonucu ilk yazan kazanır: &b{soru} = ?"
    karisik: "&e&lSOHBET OYUNU &8» &fKarışık harflerden kelimeyi bul: &b{soru}"
    odul-bilgi: "&7Ödül: &a{odul} &8| &7Süre: &f{sure} sn"
    kazandi: "&e&lSOHBET OYUNU &8» &a{oyuncu} &fkazandı! &7({saniye} sn) &8| &fCevap: &b{cevap} &8| &a+{odul}"
    bilen-yok: "&e&lSOHBET OYUNU &8» &cKimse bilemedi! &fCevap: &b{cevap}"

# ---------------------------------------------------------------------------
# Banknot: /banknot <miktar> ile para kagida doner; sag tikla paraya cevrilir.
# Oyuncular arasi takas ve sandikta para saklamak icin.
# ---------------------------------------------------------------------------
banknot:
  aktif: true
  min-miktar: 10
  max-miktar: 10000000
  esya-adi: "&a&lBanknot &8(&f{miktar}&8)"
  aciklama:
    - "&7Değer: &a{miktar}"
    - "&7Yazan: &f{oyuncu}"
    - ""
    - "&eSağ tık: &fparaya çevir"
    - "&eShift + sağ tık: &ftümünü çevir"
  mesajlar:
    kullanim: "&cKullanım: &f/banknot <miktar>"
    gecersiz: "&cGeçersiz miktar! &7({min} - {max} arası)"
    yetersiz: "&cYeterli paran yok!"
    verildi: "&a{miktar} &fdeğerinde banknot oluşturuldu."
    bozduruldu: "&a+{miktar} &fhesabına yatırıldı."

# ---------------------------------------------------------------------------
# Kelle avi: oyuncularin kellesine para odulu konur, oldurene verilir.
# ---------------------------------------------------------------------------
kelle-avi:
  aktif: true
  min-miktar: 100
  # Ayni IP'deki oyuncular birbirini oldurerek odul alamaz (yan hesap hilesi).
  ayni-ip-odul-yok: true
  mesajlar:
    kullanim:
      - "&6&lKELLE AVI"
      - "&e/kelle koy <oyuncu> <miktar> &7- kellesine ödül koy"
      - "&e/kelle liste &7- en yüksek ödüller"
      - "&e/kelle <oyuncu> &7- oyuncunun ödülüne bak"
    kendine: "&cKendi kellene ödül koyamazsın!"
    bulunamadi: "&cOyuncu bulunamadı."
    min: "&cEn az &f{min} &cödül koyabilirsin."
    yetersiz: "&cYeterli paran yok!"
    konuldu: "&6&lKELLE AVI &8» &e{koyan}&f, &c{hedef} &fkellesine &a{miktar} &fekledi! &7(Toplam: &a{toplam}&7)"
    alindi: "&6&lKELLE AVI &8» &c{hedef} &földürüldü! &e{avci} &a{miktar} &fkazandı!"
    ayni-ip: "&cAynı IP'deki oyuncudan kelle ödülü alınamaz."
    liste-baslik: "&6&lEN YÜKSEK KELLE ÖDÜLLERİ"
    liste-satir: "&e{sira}. &f{oyuncu} &8- &a{miktar}"
    liste-bos: "&7Şu an kimsenin kellesinde ödül yok."
    bilgi: "&c{oyuncu} &fkellesindeki ödül: &a{miktar}"

# ---------------------------------------------------------------------------
# Gunluk odul serisi: /odul ile her gun odul; ust uste gelindikce odul artar.
# ---------------------------------------------------------------------------
gunluk-odul:
  aktif: true
  taban: 100
  seri-artis: 50
  max: 1000
  saat-dilimi: Europe/Istanbul
  # Her odulle verilen kasa anahtari (bos birakilirsa verilmez)
  anahtar: gunluk
  # Her 7. gunde (7, 14, 21...) ek olarak bu anahtar verilir
  seri-bonus-gun: 7
  seri-bonus-anahtar: efsane
  mesajlar:
    alindi: "&a&lGÜNLÜK ÖDÜL &8» &a+{miktar} &8| &fSeri: &e{seri}. gün"
    zaten: "&cBugünkü ödülünü zaten aldın! &7Yarın tekrar gel."
    hatirlatma: "&e&lGÜNLÜK ÖDÜL &8» &fBugünkü ödülünü almadın! &e/odul &7(Seri: {seri} gün)"
    seri-bozuldu: "&7Bir gün kaçırdığın için serin sıfırlandı."

# ---------------------------------------------------------------------------
# Aktiflik odulu: AFK olmadan oynanan her X dakika icin para.
# (5 dakikadan uzun kipirdamayan oyuncu AFK sayilir.)
# ---------------------------------------------------------------------------
aktiflik-odulu:
  aktif: true
  dakika: 60
  odul: 500
  anahtar: nadir
  mesajlar:
    verildi: "&a&lAKTİFLİK ÖDÜLÜ &8» &f{dakika} dakika aktif oynadın: &a+{odul}"

# ---------------------------------------------------------------------------
# Otomatik duyurular (sirayla gonderilir)
# ---------------------------------------------------------------------------
duyurular:
  aktif: true
  aralik-dakika: 5
  mesajlar:
    - "&b&lİPUCU &8» &fArazini korumak için &6altın kürekle &fsandığının etrafını işaretle."
    - "&b&lİPUCU &8» &e/jobs &file meslek seç, çalıştıkça para kazan!"
    - "&b&lİPUCU &8» &e/odul &file her gün ödül al, seriyi bozma!"
    - "&b&lİPUCU &8» &e/kelle &file düşmanının kellesine ödül koy."
    - "&b&lİPUCU &8» &e/banknot &file parayı kağıda çevirip takas et."
    - "&b&lİPUCU &8» &e/skills &file yeteneklerini gör, seviye atla."
    - "&b&lİPUCU &8» &fSohbet oyunlarında ilk bilen para kazanır, sohbeti takip et!"
    - "&b&lİPUCU &8» &fDiscord sunucumuza katıl: &e/discord"
    - "&b&lİPUCU &8» &e/market &file eşya al, topladıklarını sat. Hepsini satmak için: &e/sat hepsi"
    - "&b&lİPUCU &8» &e/klan kur <isim> &file klanını kur, arkadaşlarınla birlikte oyna!"
    - "&b&lİPUCU &8» &e/vahsi &file dünyada rastgele bir yere ışınlan."
    - "&b&lİPUCU &8» &fSpawn'daki &dkasalarda &fanahtarlarını aç. Anahtarlar: &e/odul&f, aktiflik ödülü, KOTH."
    - "&b&lİPUCU &8» &fHer akşam arenada &6KOTH &fvar! Tepeyi tut, efsane anahtarı kazan: &e/koth"
    - "&b&lİPUCU &8» &fÖlünce eşyaların &cmezarına &fgirer, kaybolmaz. Mezarların: &e/mezar"
    - "&b&lİPUCU &8» &fEğilerek baltayla kütük kır: &aağacın tamamı devrilir! &7Kazmayla madende de çalışır."
    - "&b&lİPUCU &8» &fOlgun ekine &esağ tıkla&f: hasat edilir ve kendiliğinden yeniden ekilir."
    - "&b&lİPUCU &8» &fHer gün yeni görevler! &e/gorev &file bak, bitir, ödülü al."
    - "&b&lİPUCU &8» &fGüvenli takas için: &e/takas <oyuncu>"

# ---------------------------------------------------------------------------
# PvP'de olen oyuncunun kafasi duser
# ---------------------------------------------------------------------------
kafa-dusurme:
  aktif: true
  sans-yuzde: 100
  esya-adi: "&e{oyuncu} &fkafası"
  aciklama:
    - "&7Avcı: &f{avci}"
    - "&7Tarih: &f{tarih}"

# ---------------------------------------------------------------------------
# Giris basligi (AuthMe girisinden sonra gosterilir)
# ---------------------------------------------------------------------------
hosgeldin:
  aktif: true
  baslik: "&b&lSKY SURVIVAL"
  alt-baslik: "&7Hoş geldin, &f{oyuncu}&7!"
  ilk-giris-alt-baslik: "&eAramıza hoş geldin, &f{oyuncu}&e!"
  ses: true

# ---------------------------------------------------------------------------
# Olunce koordinat mesaji (esyalarini bulabilsin diye)
# ---------------------------------------------------------------------------
olum-koordinat:
  aktif: true
  mesaj: "&7Öldüğün yer: &f{x}, {y}, {z} &8({dunya})"

# ---------------------------------------------------------------------------
# /discord ve /site komutlarinin yazdigi satirlar
# ---------------------------------------------------------------------------
bilgi:
  discord:
    - "&9&lDISCORD &8» &fdiscord.gg/BURAYA-DAVET-KODUNU-YAZ"
  site:
    - "&b&lSİTE &8» &fwww.BURAYA-SITENI-YAZ.com"

# ---------------------------------------------------------------------------
# Gokyuzu spawn adasi. Oyunda (yetkili) once /skycore kurulum yaz, sonra
# /skycore kurulum onayla. Ada asagidaki konuma kurulur; spawn noktasi,
# warplar (market, arena, kasalar, portal, atla), hologramlar, kasalar ve
# KOTH alani otomatik ayarlanir. Ada korunur; degistirmek icin
# skycore.spawn.duzenle yetkisi gerekir (OP'lerde var).
# ---------------------------------------------------------------------------
spawn-adasi:
  dunya: world
  # Adanin merkezi (fiskiye). Ada bu noktanin 45 blok altina, 10 blok ustune uzanir.
  konum: {x: 0, y: 200, z: 0}
  # Kurulumda her tick islenen blok sayisi (sunucu takilirsa azalt)
  tick-basina-blok: 40000
  koruma:
    aktif: true
    # Adada (arena disinda) hasar ve aclik yok
    hasar-yok: true
    aclik-yok: true
    # Adada dusman yaratik dogmaz (phantom dahil)
    yaratik-dogmasin: true
  # Adadan atlayan oyuncu yere yaklasinca yavaslar ve dusme hasari almaz
  parasut:
    aktif: true
    yerden-yukseklik: 25
  # Portallarin icinde parcacik efekti
  portal-efekti: true
  mesajlar:
    kurulum-bilgi:
      - "&b&lSPAWN ADASI + KOTH ARENASI KURULUMU"
      - "&7Spawn adası: &f{dunya} {x}, {y}, {z} &8(97x56x96) &7- durum: {durum}"
      - "&7KOTH arenası (The Hill): &f{ax}, {ay}, {az} &8(135x41x141) &7- durum: {arena-durum}"
      - "&7Bu alanlardaki eski bloklar silinir. Konumları config.yml'den değiştirebilirsin."
      - "&7Spawn, 6 warp, 11 hologram, 3 kasa ve KOTH tepesi otomatik ayarlanır."
      - "&eBaşlatmak için: &f/skycore kurulum onayla"
    durum-kurulu: "&akurulu &7({x}, {y}, {z})"
    durum-yok: "&ckurulmadı"
    kurulum-basladi: "&eSpawn adası kuruluyor... &7({blok} blok)"
    kurulum-ilerleme: "&e{yapi} kuruluyor: &f%{yuzde}"
    yapi-ada: "Spawn adası"
    yapi-arena: "KOTH arenası"
    arena-bitti: "&a✔ KOTH arenası kuruldu! &7Warp: &f{warp}&7, yapımcı kafaları: &f{kafa}&7, tabelalar: &f{tabela}"
    kurulum-bitti: "&a✔ Spawn adası kuruldu! &7Spawn: &f{spawn}&7, warp: &f{warp}&7, hologram: &f{hologram}"
    sadece-dunya-spawni: "dünya spawnı (EssentialsX Spawn yok)"
    kurulum-suruyor: "&cKurulum zaten sürüyor, bitmesini bekle."
    dunya-yok: "&c'{dunya}' adında bir dünya yok."
    yukseklik: "&c{yapi} dünyanın dışına taşıyor! Yüksekliği &f{min} &cile &f{max} &carasında seç."
    hata: "&cKurulum yapılamadı: &f{hata}"
    korumali: "&cBurası spawn adası, burada bunu yapamazsın."
    pvp-kapali: "&cSpawn'da PvP kapalı! &7Savaşmak için arenaya git: &e/warp arena"
    parasut: "&b☁ Süzülüyorsun... &7(Yere yaklaşınca paraşüt açılır)"
    parasut-acildi: "&b☂ Paraşüt açıldı!"
    inis: "&a✔ Güvenle indin! İyi oyunlar."

# ---------------------------------------------------------------------------
# KOTH etkinlik arenasi: "The Hill" (Articray, TheZaner, xXFracXx - CC BY-SA 4.0,
# github.com/OvercastCommunity/PublicMaps). /skycore kurulum ile adayla birlikte
# gokyuzune kurulur. Oyuncular /warp koth ile yapimcilar adasina, /koth katil ile
# arenaya gider. Arena korunur (blok kirilmaz) ama PvP ve hasar aciktir.
# ---------------------------------------------------------------------------
koth-arenasi:
  aktif: true
  dunya: world
  # Tepenin merkezi. Arena bu noktanin 29 blok altina, 11 blok ustune uzanir.
  konum: {x: 0, y: 200, z: 220}

# ---------------------------------------------------------------------------
# Vahsi doga (/vahsi): dunyada rastgele, guvenli bir yere isinlanma.
# Spawn adasindaki "Vahsi Doga" portali da bunu kullanir.
# ---------------------------------------------------------------------------
vahsi-doga:
  aktif: true
  dunya: world
  merkez: {x: 0, z: 0}
  # Merkeze en az / en cok bu kadar blok uzaga isinlar
  min-mesafe: 500
  max-mesafe: 5000
  # Iki kullanim arasi bekleme (skycore.vahsi.bekleme-yok yetkisi olan beklemez)
  bekleme-saniye: 60
  # Guvenli yer bulmak icin en fazla deneme
  deneme: 15
  mesajlar:
    araniyor: "&7Güvenli bir yer aranıyor..."
    isinlandi: "&a✔ Vahşi doğaya ışınlandın! &7({x}, {y}, {z}) &8| &7Evini kurmayı unutma: &e/sethome"
    bekle: "&cTekrar kullanmak için &f{kalan} sn &cbekle."
    bulunamadi: "&cGüvenli bir yer bulunamadı, birazdan tekrar dene."
    savasta: "&cSavaştayken ışınlanamazsın!"
    baslik: "&a&lVAHŞİ DOĞA"
    alt-baslik: "&7İyi şanslar, maceracı!"

# ---------------------------------------------------------------------------
# Sunucu marketi (/market, /sat). Esyalar ve fiyatlar: market.yml
# ---------------------------------------------------------------------------
market:
  aktif: true
  mesajlar:
    ana-baslik: "&8&lSUNUCU MARKETİ"
    kategori-baslik: "&8Market » {kategori} &8({sayfa}/{toplam})"
