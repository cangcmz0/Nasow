# ---------------------------------------------------------------------------
# Mezar: olunce esyalar ve XP oldugun yerde bir mezara (senin kafan) girer.
# Lavda yanmaz, bosluga dusmez, baskasi kapamaz. Mezara sag tikla, hepsi geri gelir.
# ---------------------------------------------------------------------------
mezar:
  aktif: true
  # Bu sure boyunca mezari sadece sahibi acabilir, sonra herkese acilir
  kilit-dakika: 15
  # Bu sure dolunca esyalar mezarin yerine dokulur
  sure-dakika: 60
  # Oyuncu basina en fazla mezar (fazlasi olursa en eskisi dokulur)
  oyuncu-basina-en-fazla: 5
  # true: PvP'de olunce de mezar olusur (oldurenin ganimeti olmaz). false: PvP'de esyalar normal duser
  pvp-olumlerinde: false
  yazi: "&c☠ &f{oyuncu} &7mezarı"
  mesajlar:
    olustu: "&c☠ &fEşyaların mezarında: &e{x}, {y}, {z} &7({dunya}). &7İlk {kilit} dk sadece sen açabilirsin, {sure} dk sonra dökülür. &8(/mezar)"
    alindi: "&a✔ &f{oyuncu} &fmezarındaki &e{adet} &feşya alındı."
    kilitli: "&cBu mezar &f{oyuncu} &coyuncusuna ait. &7{dakika} dk sonra herkese açılır."
    kirilamaz: "&cMezar kırılamaz, sağ tıklayarak aç."
    suresi-doldu: "&7Mezarının süresi doldu, eşyalar yere döküldü: &f{x}, {y}, {z}"
    yok: "&7Açılmamış mezarın yok."
    liste-baslik:
      - "&c&l☠ MEZARLARIN"
    liste-satir: "&e{x}, {y}, {z} &7({dunya}) &8- &f{adet} eşya &8- &7{dakika} dk kaldı"

# ---------------------------------------------------------------------------
# Toplama kolayliklari. Arazi korumasi, Jobs parasi ve AuraSkills XP'si normal
# kazmadaki gibi calisir; alet her blok icin asinir.
# ---------------------------------------------------------------------------
toplama:
  # Egilerek (Shift) baltayla kutuk kirinca butun agac devrilir (sadece dogal agaclar)
  agac-kesme:
    aktif: true
    egilerek: true
    max-blok: 96
  # Egilerek kazmayla maden kirinca bitisik ayni madenler de kazilir
  damar-kazma:
    aktif: true
    egilerek: true
    max-blok: 24
  # Olgun ekine sag tikla: hasat edilir, tohum kendiliginden yeniden ekilir
  sag-tik-hasat:
    aktif: true

